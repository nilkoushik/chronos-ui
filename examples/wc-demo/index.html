<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronos UI Web Components Demo</title>
    <style>
      body {
        margin: 0;
        background: #020617;
        color: #f1f5f9;
        font-family: system-ui, sans-serif;
      }
      .demo-container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 2rem;
      }
      h1 {
        text-align: center;
        color: #a78bfa;
        margin-bottom: 3rem;
      }
      section {
        margin-bottom: 4rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      h2 {
        color: #38bdf8;
        margin-bottom: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="demo-container">
      <h1>Chronos UI Web Components</h1>
      
      <section>
        <h2>Announcement Bar</h2>
        <announcement-bar message="Special Offer! Use code WC20" background-color="#8b5cf6" text-color="#ffffff" map-links='[{"url":"#"}]'></announcement-bar>
      </section>

      <section>
        <h2>Timer Widget</h2>
        <timer-widget title="Ends in:" target-date="2027-12-31T23:59:59Z"></timer-widget>
      </section>

      <section>
        <h2>Banner</h2>
        <banner title="Welcome Banner" subtitle="This is a simple banner component" cta-text="Shop Now" text-alignment="center"></banner>
      </section>

      <section>
        <h2>Grid Banner</h2>
        <grid-banner 
          columns="4"
          items='[{"id":"1","title":"Grid 1","media":{"type":"image","url":"https://placehold.co/400x400"}},{"id":"2","title":"Grid 2","media":{"type":"image","url":"https://placehold.co/400x400"}},{"id":"3","title":"Grid 3","media":{"type":"image","url":"https://placehold.co/400x400"}},{"id":"4","title":"Grid 4","media":{"type":"image","url":"https://placehold.co/400x400"}}]'
        ></grid-banner>
      </section>
      
      <section>
        <h2>Media Grid</h2>
        <media-grid 
          primary-media='{"id":"p1","media":{"type":"image","url":"https://placehold.co/600x600"}}'
          secondary-media='[{"id":"s1","media":{"type":"image","url":"https://placehold.co/300x300"}},{"id":"s2","media":{"type":"image","url":"https://placehold.co/300x300"}}]'
        ></media-grid>
      </section>
      
      <section>
        <h2>Row Scrollable</h2>
        <row-scrollable 
          title="Scrollable Row" 
          items='[{"id":"1","title":"Item 1","media":{"type":"image","url":"https://placehold.co/200x200"}},{"id":"2","title":"Item 2","media":{"type":"image","url":"https://placehold.co/200x200"}},{"id":"3","title":"Item 3","media":{"type":"image","url":"https://placehold.co/200x200"}}]'
        ></row-scrollable>
      </section>
      
      <section>
        <h2>Sliding Banner</h2>
        <sliding-banner 
          config='{"autoStart":true,"showDots":true,"animationEffect":"fade"}'
          items='[{"id":"1","title":"Slide 1","subtitle":"First slide description","media":{"type":"image","url":"https://placehold.co/800x400"}},{"id":"2","title":"Slide 2","subtitle":"Second slide description","media":{"type":"image","url":"https://placehold.co/800x400"}}]'
        ></sliding-banner>
      </section>
      
      <section>
        <h2>Alternating Slider</h2>
        <alternating-slider 
          items='[{"id":"1","title":"Alternating 1","subtitle":"Description 1","media":{"type":"image","url":"https://placehold.co/500x500"}},{"id":"2","title":"Alternating 2","subtitle":"Description 2","media":{"type":"image","url":"https://placehold.co/500x500"}}]'
        ></alternating-slider>
      </section>
      
      <section>
        <h2>Rich Text Editor</h2>
        <div style="border: 1px solid #334155; border-radius: 8px; overflow: hidden;">
          <rich-text-editor initial-content="<p>Hello World from Web Components!</p>"></rich-text-editor>
        </div>
      </section>

      <section>
        <h3 style="margin-top: 1rem;">WYSIWYG Renderer (Output)</h3>
        <div style="padding: 1rem; background: #0f172a; border-radius: 8px;">
          <wysiwyg-renderer content="<p>Hello World from Web Components!</p>"></wysiwyg-renderer>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
