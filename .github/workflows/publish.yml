name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
      id-token: write   # for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Reset npm config
        run: |
          npm config delete always-auth || true
          npm config set fund false
          npm config set audit false

      - name: Verify npm auth token
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is not configured for this repository."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== dist/ tree ==="
          ls -R dist/ || echo "dist/ missing — build may have failed"

      - name: Publish to npm
        run: |
          # Keeping the beta dist-tag in sync with stable releases is handled
          # by the `postpublish` lifecycle hook (scripts/sync-beta-tag.js) so
          # it applies the same way here and for a manual `npm publish` run
          # from a local machine.
          if [[ "${GITHUB_REF}" == *"-beta"* ]] || [[ "${GITHUB_REF_NAME}" == *"-beta"* ]]; then
            npm publish --access public --provenance --tag beta
          else
            npm publish --access public --provenance
          fi
